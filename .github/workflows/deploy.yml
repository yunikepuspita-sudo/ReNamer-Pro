name: Deploy ke GitHub Pages

on:
  # Deploy saat ada perubahan di branch utama atau branch fitur ini.
  push:
    branches:
      - main
      - claude/admiring-maxwell-a1Zz3
  # Memungkinkan menjalankan workflow secara manual dari tab Actions.
  workflow_dispatch:

# Izin yang dibutuhkan agar GITHUB_TOKEN bisa men-deploy ke Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya izinkan satu deployment berjalan dalam satu waktu.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Aktifkan GitHub Pages secara otomatis bila belum aktif.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
