name: CI

# Memverifikasi build di setiap Pull Request ke main agar kode rusak
# tidak bisa di-merge. Wajibkan check ini lewat Branch protection rule.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Nama check = "build" agar cocok dengan required status check di
    # Branch protection rule pada branch main.
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build
